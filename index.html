<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="main.js" defer></script>
  </head>
  <body>
    <header><h1>Temperature Converter</h1></header>
    <main>
      <article class="converter">
        <p class="description">
          Enter the temperature, select units and submit
        </p>
        <section class="converter-input">
          <input type="text" name="temperature" id="temperature" />
          <select name="from-unit" id="from-unit">
            <option value="fahrenheit">Fahrenheit</option>
            <option value="celsius">Celsius</option>
            <option value="kelvin">Kelvin</option>
          </select>
          <select name="to-unit" id="to-unit">
            <option value="fahrenheit">Fahrenheit</option>
            <option value="celsius">Celsius</option>
            <option value="kelvin">Kelvin</option>
          </select>
          <button class="submit">Convert</button>
        </section>
        <p class="result"></p>
      </article>
    </main>
    <footer>
      &copy; <time datetime="2026">2026</time> All rights reserved
    </footer>
  </body>
</html>
